[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrfm"
dynamic = ["version"]
description = "XR Foundation Model — open-source foundation model implementation in pure PyTorch"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "XR Foundation Model Contributors"}
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.3.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "httpx>=0.24.0",
    # The API server is part of the tested surface (tests/test_api.py, mypy api/):
    # dev installs must include it or CI lint/type/test jobs fail on imports.
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
]

[project.scripts]
xrfm = "xrfm.cli:main"

[tool.setuptools.dynamic]
# Single version source: xrfm/__init__.py (do not duplicate elsewhere).
version = {attr = "xrfm.__version__"}

[tool.setuptools.packages.find]
# Only the library ships in the wheel — never api/, scripts/, or the
# repo-root compatibility shims.
where = ["src"]
include = ["xrfm*"]

[tool.setuptools.package-data]
xrfm = [
    "py.typed",
    "tokenization/vocab.json",
    "config/*.yaml",
]

[tool.black]
# Aligned with ruff's line-length (120) so `black --check` and
# `ruff format --check` agree.
line-length = 120
target-version = ["py310"]
# Root shims (model/, tokenizer/, ... deprecated compat paths) and research/
# are deprecation/experimental artifacts excluded from core format gates.
exclude = "data/|notebooks/|vercel_app/|webui/|(model|tokenizer|training|inference|evaluation|optimization)/"

[tool.ruff]
line-length = 120
target-version = "py310"
# data/ contains training corpora (e.g. a copy of the Python stdlib used as
# training data); notebooks/ and the JS apps are not Python; research/ is the
# experimental NeuroTopo bundle (not held to core lint rules until it
# graduates) — excluded.
exclude = [
    "data/", "notebooks/", "vercel_app/", "webui/", "build/", "dist/",
    # Docs keep human-formatted snippet style (aligned assignments in fences);
    # ruff>=0.16 would reformat Python blocks inside Markdown.
    "**/*.md",
    # Deprecated root import shims (removed >= v2.0) — not part of the wheel.
    "model/", "tokenizer/", "training/", "inference/", "evaluation/", "optimization/",
    # Experimental NeuroTopo research bundle — not held to core lint gates.
    "src/xrfm/research/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N806", "N812", "N817", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
