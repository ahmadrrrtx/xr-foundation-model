<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XRFM Chat</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header>
  <h1>XR Foundation Model</h1>
  <div class="header-right">
    <span id="model-info">Loading...</span>
    <button id="theme-toggle" onclick="toggleTheme()">☀️</button>
    <button onclick="clearChat()">🗑️</button>
  </div>
</header>

<div id="settings-panel">
  <label>Temperature: <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.8"><span id="temp-val">0.8</span></label>
  <label>Top-K: <input type="number" id="top-k" min="0" max="1000" value="0" placeholder="off"></label>
  <label>Top-P: <input type="number" id="top-p" min="0" max="1" step="0.05" value="0.9"></label>
  <label>Max Tokens: <input type="number" id="max-tokens" min="1" max="4096" value="256"></label>
</div>

<div id="chat-container">
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="prompt" placeholder="Type a message..." rows="3"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
    <button id="stream-btn" onclick="sendStream()">Stream</button>
  </div>
</div>

<script src="/ui/app.js"></script>
</body>
</html>
