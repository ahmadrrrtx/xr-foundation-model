# XRFM Dual-Track Governed Data Source Registry (v2.0)
# Strictly aligned with docs/research/XRFM_RESEARCH_REVIEW.md (§4–6)
#
# License Tiers:
#   - tier_a   : Commercial-permissive (Apache-2.0, MIT, BSD-2/3, CC0-1.0, PSF-2.0)
#   - tier_b   : Permissive with attribution (ODC-By-1.0, CC-BY-4.0) -> NOTICE.md required
#   - rag_only : Copyleft / ShareAlike (CC-BY-SA-4.0) -> isolated RAG vector index ONLY; ZERO weight training
#   - eval_only: Non-commercial / benchmark suites -> evaluation & contamination gate ONLY; ZERO weight training
#   - hold     : Quarantined / rejected sources (enabled: false)

registry_version: "2.0"

sources:
  # ==========================================================================
  # Local Deterministic Smoke & Golden Verification Corpus
  # ==========================================================================
  golden_test:
    name: golden_test
    type: web
    uri: tests/data/golden/documents.jsonl
    license: MIT
    license_url: https://opensource.org/licenses/MIT
    license_tier: tier_a
    allowed_uses: [train_track_a, train_track_b]
    version: v1.0
    revision: local-golden-v1
    language: en
    languages: [en]
    enabled: true
    weight: 0.02
    format: jsonl
    text_field: text
    attribution: "XRFM Project (MIT)"

  # ==========================================================================
  # Tier A & Tier B Pretraining / Continued-Pretraining Sources (Track A & B)
