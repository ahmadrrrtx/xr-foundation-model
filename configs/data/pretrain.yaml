# XRFM Pretraining Data Pipeline Config (v2.0 — Dual-Track 7-Language + Code)
# Aligned with GATE-1 (SPDX governance, 7-lang + Roman-Urdu LID, Banded MinHash-LSH, L+1 lossless causal shards)

dataset_name: xrfm-pretrain
dataset_version: 2.0.0
output_dir: processed/xrfm-pretrain-v2.0
sequence_length: 2048
seed: 42
pipeline_version: xrfm-pipeline-v2

# Governed SPDX Source Registry
sources_registry: configs/data/sources.yaml

# 8-Class Language Identification (7 target languages + source code)
language:
  threshold: 0.35
  fallback_language: unknown
  trust_source_metadata_when_uncertain: false
  allowed_languages:
    - en
    - ur
    - ur-Latn
    - ar
    - hi
    - es
    - fr
    - code

# Quality filtering
quality:
  min_chars: 50
  max_chars: 100000
  min_words: 10
  max_symbol_ratio: 0.4
  max_number_ratio: 0.6
  max_repetition_ratio: 0.4
  boilerplate_threshold: 0.6
  overall_threshold: 0.3
  allow_code: true

# PII & secret heuristic filtering
pii:
  remove_high_risk: true
  transform_medium_risk: false
  flag_emails: true
  flag_phones: true
  flag_secrets: true
  flag_sensitive_ids: true
  high_risk_if_secret: true

# Deduplication (SHA-256 exact + Banded MinHash-LSH near dedup)
exact_dedup:
  enabled: true
  keep: first

near_dedup:
  enabled: true
  threshold: 0.85
  num_perm: 128
  num_bands: 16
  shingle_size: 5
  seed: 42

# Deterministic hash-based document splitting
split:
  train_ratio: 0.94
  val_ratio: 0.03
  test_ratio: 0.03
  seed: 42
  method: hash

# Tokenization
tokenization:
  add_eos: true
  add_bos: false
  max_length: null

# Packing (include_next_token: true stores L+1 tokens per row so zero boundary targets are wasted)
packing:
  sequence_length: 2048
  include_next_token: true
  add_eos_between_docs: true
  allow_cross_document: true
  leftover_handling: drop
  preserve_boundaries: false

# Sharding
sharding:
  num_shards: 8
  dtype: auto
  output_dir: processed/xrfm-pretrain-v2.0/tokens
  shard_prefix: shard

# Frozen Evaluation Contamination Gate
contamination:
  ngram_size: 8
  threshold: 0.5
  check_exact_hash: true
  check_ngram: true
  manifest_path: configs/eval/frozen_benchmarks_v1.json

# Pipeline options
do_near_dedup: true
do_exact_dedup: true
check_contamination: true
contamination_manifest_path: configs/eval/frozen_benchmarks_v1.json
