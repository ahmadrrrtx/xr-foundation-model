# XR Foundation Model (XRFM) — Configuration v0.7.0
# Source of truth for model architecture, dataset selection, and training hyperparameters.
# Changing model scale (10M -> 100M -> 1B) requires only config updates — no code rewrites.

project:
  name: "XR Foundation Model"
  package: "xrfm"
  version: "1.0.0"

paths:
  data_dir: "data/"
  checkpoint_dir: "checkpoints/"
  tokenizer_path: "tokenizer/"
  log_dir: "logs/"
  manifest_dir: "data/manifests/"

datasets:
  default: "tiny_shakespeare"
  path: "data/datasets/"
  train_ratio: 0.9
  val_ratio: 0.05
  test_ratio: 0.05
  shuffle: true
  streaming: false  # Reserved for Phase 8 (scaling)
  seed: 42

model:
  vocab_size: 50304
  d_model: 256
  n_layers: 6
  n_heads: 8
  d_ff: 1024
  max_seq_len: 512
  dropout: 0.1
  use_rope: true
  use_rmsnorm: true
  use_swiglu: true

training:
  batch_size: 32
  max_steps: 50000
  warmup_steps: 1000
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip: 1.0
  mixed_precision: true
  checkpoint_every: 1000
  resume_from: null
  grad_accum_steps: 1
  use_ddp: false
  use_fsdp: false
