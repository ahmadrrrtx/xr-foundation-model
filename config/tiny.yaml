# XRFM-TINY — unit/integration tests (fastest possible round-trip).
project:
  name: "XR Foundation Model"
  package: "xrfm"
  version: "1.0.1"

paths:
  data_dir: "data/"
  checkpoint_dir: "checkpoints/tiny/"
  tokenizer_path: "tokenizer/"
  log_dir: "logs/"
  manifest_dir: "data/manifests/"

datasets:
  default: "tiny_corpus"
  path: "data/datasets/"
  train_ratio: 0.9
  val_ratio: 0.05
  test_ratio: 0.05
  shuffle: true
  streaming: false
  seed: 42

model:
  vocab_size: 1024
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  max_seq_len: 128
  dropout: 0.1
  use_rope: true
  use_rmsnorm: true
  use_swiglu: true

training:
  batch_size: 8
  max_steps: 200
  warmup_steps: 20
  learning_rate: 0.0006
  weight_decay: 0.1
  gradient_clip: 1.0
  mixed_precision: false
  checkpoint_every: 50
  resume_from: null
  grad_accum_steps: 1
  use_ddp: false
  use_fsdp: false
  seed: 42
  error_if_nonfinite: false
  ignore_index: -100
  eval_every: 0
  num_workers: 0           # dataloader workers (0 = main process)
  pin_memory: false        # pin loader buffers for non-blocking GPU transfers
  prefetch_factor: null    # loader prefetch (workers > 0 required)
  persistent_workers: false
  device: null             # null = auto (cuda if available else cpu)
  deterministic: false     # torch.use_deterministic_algorithms (warn-only)
