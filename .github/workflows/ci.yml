name: CI - Lint, Type Check, Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run ruff (lint + format check)
        run: ruff check . && ruff format --check .
      - name: Run black (format check)
        run: black --check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run mypy
        # Forensic-audit fix (F-43): `|| true` previously masked type errors.
        # Core package + API app. src/xrfm/research is the experimental
        # NeuroTopo bundle (excluded from core lint gates until it graduates).
        run: mypy src/xrfm/config src/xrfm/data src/xrfm/models src/xrfm/tokenization src/xrfm/training src/xrfm/inference src/xrfm/evaluation src/xrfm/optimization src/xrfm/search src/xrfm/cli.py api/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            test-results.xml

  package:
    name: Package & Clean Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Wheel must contain only the xrfm package
        run: |
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          tops = {n.split("/")[0] for n in zipfile.ZipFile(wheel).namelist()}
          assert tops == {"xrfm", "xrfm-1.0.1.dist-info"} or len([t for t in tops if not t.endswith(".dist-info")]) == 1, tops
          print("wheel top-level:", sorted(tops))
          PY
      - name: Clean install + import outside the repo
        run: |
          python -m venv /tmp/pkgvenv
          /tmp/pkgvenv/bin/pip install --no-deps dist/*.whl
          cd /
          /tmp/pkgvenv/bin/python -c "import xrfm; print('clean install:', xrfm.__version__)"
          /tmp/pkgvenv/bin/python -c "from xrfm import XRFM, XRFMConfig, Trainer, generate, evaluate, load_config, BPETokenizer; cfg = load_config(); print('config loads from /:', cfg.model.d_model)"
          /tmp/pkgvenv/bin/xrfm info

  training-smoke:
    name: Training Pipeline Smoke Test
    # Phase 28: CI previously never trained anything. This fast CPU run fails
    # the build if the training pipeline regresses (loss must decrease,
    # checkpoint must save/load, resume must restore state).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run training smoke test
        run: python scripts/ci_smoke_test.py
